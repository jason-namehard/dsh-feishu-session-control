name: Create Cloudflare Pages project

on:
  push:
    branches:
      - fix/ci-dependency-install
    paths:
      - .github/workflows/bootstrap-pages.yml

jobs:
  create-project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 4d932cf9c941871e53b08c5ebaada409
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Pages project
        run: npx --yes wrangler@4 pages project create dsh-feishu-session-control --production-branch=main
